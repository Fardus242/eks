apiVersion: apps/v1
kind: Deployment

metadata:
  name: 2048-game

spec:
  replicas: 2

  selector:
    matchLabels:
      app: 2048-game

  template:
    metadata:
      labels:
        app: 2048-game

    spec:
      containers:
        - name: 2048-game
          image: 388212729357.dkr.ecr.eu-west-2.amazonaws.com/2048-game:v1

          ports:
            - containerPort: 80