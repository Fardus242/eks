apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: 2048-game
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Fardus242/eks.git
    targetRevision: main
    path: kubernetes/2048-game

    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
