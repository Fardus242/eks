name: Build, Scan and Push Docker Image

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t 2048-game ./app

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "2048-game"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

   
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ADMINARN }}
          aws-region: eu-west-2
         
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push Docker image
        env:
          ECR_REGISTRY: 388212729357.dkr.ecr.eu-west-2.amazonaws.com
          ECR_REPOSITORY: 2048-game
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag 2048-game:latest $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
      
      - name: Update Helm image tag
        run: |
          sed -i "s/tag: .*/tag: ${{ github.sha }}/" kubernetes/2048-game/values.yaml

      - name: Commit and push Helm change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/2048-game/values.yaml
          git commit -m "Update image tag to ${{ github.sha }}"
          git push